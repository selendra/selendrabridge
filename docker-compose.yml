# The off-chain bridge stack, dockerized — COMPLETE product surface (finding H4).
#
# Previously this shipped only sig-store + validators + keeper, so the advertised
# refund path could never run (no indexer to mark transfers refund-eligible) and
# there was no product surface (no GraphQL, no UI). It now runs the full topology:
#
#   postgres ─ sig-store ─ 3 validators ─ keeper ─ indexer ─ graphql-api ─ frontend
#
# with health-gated startup ordering, restart policies, and non-root services.
# The gate addresses in docker/configs/* are anvil's DETERMINISTIC deploy
# addresses (account #0 deploys TestToken then Gate). Deploy + wire with
# docker/deploy.sh.
#
# Bring-up:
#   docker compose up -d anvil-src anvil-dst
#   bash docker/deploy.sh                 # deploys + wires on both chains
#   docker compose up -d                  # brings up the rest, health-ordered
#   # open http://localhost:8080 (UI); send a transfer on localhost:8545 and
#   # watch it flow through to EXECUTED.
#
# For GraphiQL + schema introspection, add the dev override (M-15) — it is opt-in
# because this file is the template people adapt for a real deployment:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# EXPOSURE (audit 2026-09-16, M-15):
#   * Every published port binds 127.0.0.1 ONLY. A bare `8545:8545` listens on
#     every interface AND writes its own DNAT rule, which bypasses ufw/firewalld
#     — an open unauthenticated RPC and a schema-dumping endpoint. To reach the
#     stack from elsewhere, front it with the TLS + auth terminator in
#     docker/production/, do not republish on 0.0.0.0.
#   * Postgres and the sig-store are not published at all (internal network).
#   * graphql-api runs with `--production`: no GraphiQL, no introspection, and
#     `chains` serves only the keyless `public_rpc_url`.
#
# PRODUCTION NOTES:
#   * Set real secrets: one per service (see the sig-store block below), e.g.
#       SIG_STORE_VALIDATOR_TOKEN=$(openssl rand -hex 32) docker compose up -d
#   * Replace the anvil services + baked keys/addresses with your real chains,
#     and give each a `public_rpc_url` in docker/configs/chains.json — a keyless
#     endpoint safe to hand to a browser. `--production` refuses to start without
#     one, which is the point: it is the only url the API serves publicly.

x-restart: &restart
  restart: unless-stopped

services:
  anvil-src:
    image: ghcr.io/foundry-rs/foundry:latest@sha256:0c00cb0bda1ab1b91c9a6bf60f4c76c09c1a8870824b6d4718afbabacf6f9a17
    <<: *restart
    # foundry image entrypoint wraps the command in a shell, hence one string.
    command: ["anvil --host 0.0.0.0 --chain-id 1337"]
    ports: ["127.0.0.1:8545:8545"]
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://localhost:8545"]
      interval: 3s
      timeout: 3s
      retries: 20

  anvil-dst:
    image: ghcr.io/foundry-rs/foundry:latest@sha256:0c00cb0bda1ab1b91c9a6bf60f4c76c09c1a8870824b6d4718afbabacf6f9a17
    <<: *restart
    command: ["anvil --host 0.0.0.0 --chain-id 1338"]
    ports: ["127.0.0.1:8546:8545"]
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://localhost:8545"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    <<: *restart
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a random secret}"
      POSTGRES_DB: bridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host — internal network only (production-safe).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Per-service credentials (finding L-5). Each token carries only the scopes its
  # holder needs, so a leak from one component cannot act as another — notably the
  # GraphQL API, the most exposed service, holds a READ-ONLY token.
  #   read  : everyone        sign : validators
  #   relay : keeper          admin: operators
  # OVERRIDE all of them in real deployments, e.g.
  #   SIG_STORE_VALIDATOR_TOKEN=$(openssl rand -hex 32) ... docker compose up -d
  # The legacy all-scopes SIG_STORE_TOKEN is still honoured but logs a warning.
  sig-store:
    build: .
    <<: *restart
    command: ["sig-store"]
    environment:
      SIG_STORE_BIND: "0.0.0.0:8080"
      DATABASE_URL: "postgres://bridge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a random secret}@postgres:5432/bridge"
      SIG_STORE_VALIDATOR_TOKEN: "${SIG_STORE_VALIDATOR_TOKEN:?set SIG_STORE_VALIDATOR_TOKEN, e.g. $(openssl rand -hex 32)}"
      SIG_STORE_KEEPER_TOKEN: "${SIG_STORE_KEEPER_TOKEN:?set SIG_STORE_KEEPER_TOKEN, e.g. $(openssl rand -hex 32)}"
      SIG_STORE_READER_TOKEN: "${SIG_STORE_READER_TOKEN:?set SIG_STORE_READER_TOKEN, e.g. $(openssl rand -hex 32)}"
      SIG_STORE_ADMIN_TOKEN: "${SIG_STORE_ADMIN_TOKEN:?set SIG_STORE_ADMIN_TOKEN, e.g. $(openssl rand -hex 32)}"
      RUST_LOG: "sig_store=info,bridge_db=info"
    depends_on:
      postgres:
        condition: service_healthy
    # Not published to the host — internal network only (production-safe).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  validator1:
    build: .
    <<: *restart
    command: ["validator", "/configs/val1.toml"]
    environment:
      SIG_STORE_VALIDATOR_TOKEN: "${SIG_STORE_VALIDATOR_TOKEN:?set SIG_STORE_VALIDATOR_TOKEN, e.g. $(openssl rand -hex 32)}"
    volumes:
      - ./docker/configs:/configs:ro
      - val1-state:/data
    depends_on:
      sig-store:
        condition: service_healthy
      anvil-src:
        condition: service_healthy

  validator2:
    build: .
    <<: *restart
    command: ["validator", "/configs/val2.toml"]
    environment:
      SIG_STORE_VALIDATOR_TOKEN: "${SIG_STORE_VALIDATOR_TOKEN:?set SIG_STORE_VALIDATOR_TOKEN, e.g. $(openssl rand -hex 32)}"
    volumes:
      - ./docker/configs:/configs:ro
      - val2-state:/data
    depends_on:
      sig-store:
        condition: service_healthy
      anvil-src:
        condition: service_healthy

  validator3:
    build: .
    <<: *restart
    command: ["validator", "/configs/val3.toml"]
    environment:
      SIG_STORE_VALIDATOR_TOKEN: "${SIG_STORE_VALIDATOR_TOKEN:?set SIG_STORE_VALIDATOR_TOKEN, e.g. $(openssl rand -hex 32)}"
    volumes:
      - ./docker/configs:/configs:ro
      - val3-state:/data
    depends_on:
      sig-store:
        condition: service_healthy
      anvil-src:
        condition: service_healthy

  keeper:
    build: .
    <<: *restart
    command: ["keeper", "/configs/keeper.toml"]
    environment:
      SIG_STORE_KEEPER_TOKEN: "${SIG_STORE_KEEPER_TOKEN:?set SIG_STORE_KEEPER_TOKEN, e.g. $(openssl rand -hex 32)}"
    volumes:
      - ./docker/configs:/configs:ro
    depends_on:
      sig-store:
        condition: service_healthy
      anvil-dst:
        condition: service_healthy

  # Indexer — the previously-missing piece: it marks stranded transfers
  # refund-eligible (populating the validators' candidate list) and records
  # on-chain cancel/refund state. Writes to the shared Postgres.
  indexer:
    build: .
    <<: *restart
    command: ["indexer", "/configs/indexer.toml"]
    environment:
      DATABASE_URL: "postgres://bridge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a random secret}@postgres:5432/bridge"
      RUST_LOG: "indexer=info,bridge_db=info"
    volumes:
      - ./docker/configs:/configs:ro
    depends_on:
      # Also wait for sig-store: it runs the (idempotent) schema migration first,
      # so the indexer's migrate() finds the tables already present. Postgres's
      # `CREATE TABLE IF NOT EXISTS` still races two SIMULTANEOUS first-creates on
      # pg_type, so we serialize the first migration behind sig-store rather than
      # run both at once.
      sig-store:
        condition: service_healthy
      postgres:
        condition: service_healthy
      anvil-src:
        condition: service_healthy
      anvil-dst:
        condition: service_healthy

  # GraphQL API — the product surface the frontend queries. Reads the sig-store,
  # the indexer's Postgres (history/refund), and each chain's gate for on-chain
  # status. Mutations stay OFF (read-only) unless you flip GRAPHQL_ALLOW_MUTATIONS.
  graphql-api:
    build: .
    <<: *restart
    command:
      - "graphql-api"
      - "--bind"
      - "0.0.0.0:8088"
      - "--store-url"
      - "http://sig-store:8080"
      - "--threshold"
      - "2"
      - "--chains-file"
      - "/configs/chains.json"
      # M-15: GraphiQL and introspection OFF, and `chains` serves only the
      # keyless `public_rpc_url`. This file's own header tells operators to swap
      # in their real chains, so its DEFAULT is what ends up facing the
      # internet. For local exploration add the dev override, which turns the
      # playground back on:
      #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
      - "--production"
    environment:
      # READ-ONLY, and this is now the service's ONLY credential. It used to also
      # carry DATABASE_URL with the same full-privilege `bridge` role the
      # sig-store uses, which made every scope above decorative for exactly the
      # component they were designed to contain: this is the only service
      # published to the internet, and a direct Postgres connection sits outside
      # `bridge_core::auth` entirely. `history`/`swapHistory` now come back
      # through the sig-store's Read-scoped routes instead.
      SIG_STORE_READER_TOKEN: "${SIG_STORE_READER_TOKEN:?set SIG_STORE_READER_TOKEN, e.g. $(openssl rand -hex 32)}"
      RUST_LOG: "graphql_api=info"
    volumes:
      - ./docker/configs:/configs:ro
    ports: ["127.0.0.1:8088:8088"]
    depends_on:
      sig-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Frontend — non-root nginx serving the built SPA, proxying /graphql + /health
  # to graphql-api (same-origin, no CORS).
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    <<: *restart
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      graphql-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  val1-state:
  val2-state:
  val3-state:
