[package]
name = "price-keeper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Keeps EVM SwapPool prices fresh: re-asserts (or steps toward) configured prices before maxPriceAge expires them"

# The Solana pool's refresher is `solana-price-keeper` in crates/solana-relayer:
# solana-client and alloy cannot share a binary. Both plan with swap-math::refresh.

[dependencies]
bridge-core = { workspace = true, features = ["abi"] }
swap-math = { workspace = true }
alloy = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
