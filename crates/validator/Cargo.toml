[package]
name = "validator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bridge-core = { workspace = true, features = ["abi", "http", "axum-auth"] }
alloy = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
axum = { workspace = true }
# H-2, EVM->Solana: read the Solana gate's ["asset", debridgeId] account to learn
# the scale it pays out at. Same crates and features graphql-api already uses for
# the same read, so the PDA derivation and the account layout are the tested ones
# (swap-math's `pda` is parity-tested against the program's own derivation, and
# its curve25519-dalek 4 is the version that links alongside alloy).
swap-math = { workspace = true, features = ["pda"] }
bridge-solana = { workspace = true, default-features = false }
base64 = "0.22"
bs58 = "0.5"

[dev-dependencies]
# Drive the operator-API router in-process (no socket) via `oneshot`, so the
# tests cover the HTTP handlers rather than only the `Runtime` beneath them.
tower = { version = "0.5", features = ["util"] }
