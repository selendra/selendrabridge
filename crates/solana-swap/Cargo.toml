[package]
name = "solana-swap"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Solana same-chain swap pool — the on-chain counterpart of SwapPool.sol"

# Built with the Solana toolchain, NOT the host workspace (same reason as
# crates/solana-gate: the solana-program / spl-token deps only link for the
# BPF/SBF target, and solana-client's zeroize pin cannot coexist with alloy).
#
#     bash scripts/testing/build-solana.sh swap
#
# The pricing math is shared with SwapPool.sol and proven equal against fixtures
# the Solidity contract itself produced — see `tests/parity.rs`.

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=1.18.26"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
borsh = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "1"
# The pricing math and account layouts, shared with the read API. Declared once
# so the program and every off-chain reader cannot drift apart.
swap-math = { path = "../swap-math" }

[features]
no-entrypoint = []

[dev-dependencies]
solana-program-test = "=1.18.26"
solana-sdk = "=1.18.26"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

# The deployed bytecode is built `--release` by `cargo build-sbf`, where Rust's
# default is WRAP on overflow, while the host `cargo test` runs `dev`, where it
# panics. Without this the tests check stricter arithmetic than the program that
# ships (audit 2026-09-16, M-13). The code uses `checked_*` at every hot spot;
# this is the belt to that pair of braces.
[profile.release]
overflow-checks = true
