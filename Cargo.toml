[workspace]
resolver = "2"
members = [
    "crates/bridge-core",
    "crates/bridge-db",
    "crates/bridge-solana",
    "crates/validator",
    "crates/keeper",
    "crates/sig-store",
    "crates/graphql-api",
    "crates/indexer",
    "crates/swap-math",
    "crates/price-keeper",
    "crates/log-scrub",
]
# The deployable Solana BPF program is built with the Solana toolchain
# (`cargo build-sbf`), not the host workspace — its solana-program/spl-token deps
# don't compile for the host target.
exclude = ["crates/solana-gate", "crates/solana-swap", "crates/solana-relayer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
swap-math = { path = "crates/swap-math" }
bridge-solana = { path = "crates/bridge-solana" }
bridge-core = { path = "crates/bridge-core" }
log-scrub = { path = "crates/log-scrub" }
bridge-db = { path = "crates/bridge-db" }

alloy = { version = "1.0", features = [
    "full",
    "signer-local",
    "signer-keystore",
    "node-bindings",
] }
alloy-primitives = { version = "1.0", features = ["serde"] }
alloy-sol-types = "1.0"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
# Postgres source of truth (transaction history + token/chain allowlists). Runtime
# queries (no compile-time DB needed); rustls so no system libpq/openssl required.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono",
] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
