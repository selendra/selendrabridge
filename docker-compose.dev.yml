# Local-exploration override — OPT IN, never the default (audit 2026-09-16, M-15).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   # then open http://localhost:8088 for GraphiQL
#
# What this turns back on, and why it is not in the base file:
#
#   * GraphiQL + schema introspection. Handy locally; on a public deployment it
#     hands an attacker the whole schema, including every mutation, and the
#     playground answers a GET on `/graphql` and `/`.
#   * The `chains` query serves `rpc_url` as well as `public_rpc_url`. The
#     server-side url may carry a provider key (H-3/H-4) — with this override,
#     anything that can reach the API can read it.
#
# Ports stay on 127.0.0.1 even here. If you genuinely need to reach the stack
# from another machine, put it behind the TLS + auth terminator in
# docker/production/ rather than republishing on 0.0.0.0.
#
# `command` is REPLACED by compose, not merged, so this repeats the base
# argv minus `--production`. Keep the two in sync when either changes.

services:
  graphql-api:
    command:
      - "graphql-api"
      - "--bind"
      - "0.0.0.0:8088"
      - "--store-url"
      - "http://sig-store:8080"
      - "--threshold"
      - "2"
      - "--chains-file"
      - "/configs/chains.json"
