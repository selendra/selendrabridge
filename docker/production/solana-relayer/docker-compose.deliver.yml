# Overlay: adds the EVM->Solana delivery (keeper) role to the relayer.
#
#   docker compose -f docker-compose.yml -f docker-compose.deliver.yml up -d
#
# Use it ONLY with a config that has a `[target]` block. Run one of these for
# the whole mesh, on the keeper machine — not one per validator operator, or
# they will race to submit the same claim (harmless but wasteful: each submit
# re-reads the on-chain marker first, so the loser lands nothing).
services:
  solana-relayer:
    secrets:
      - solana_payer
    environment:
      # Only used by the delivery loop; harmless when unset in sign-only mode.
      RUST_LOG: "${RUST_LOG:-info}"
      # The marker observer's credential (Indexer scope). The delivering relayer
      # reads the gate's ["executed"|"refunded", id] markers and reports observed
      # claimed/cancelled/refunded to the store — the Solana gate's stand-in for
      # the EVM indexer. Named by `[store] indexer_token_env` in the config.
      SIG_STORE_INDEXER_TOKEN: "${SIG_STORE_INDEXER_TOKEN:?set SIG_STORE_INDEXER_TOKEN}"

secrets:
  # The Solana keypair that pays fees and rent for claim transactions. It holds
  # NO BRIDGE AUTHORITY — the validators' secp256k1 signatures carry that — so it
  # only needs enough SOL for fees. Keep it small and monitor the balance.
  solana_payer:
    file: ./secrets/payer.json
